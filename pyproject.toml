[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whiletrue"
version = "0.0.0"
description = "Run configurable loops of agentic and deterministic steps around coding agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Darius Singh" }]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "pyyaml>=6,<7",
  "common-expression-language>=0.10,<1",
]

[project.urls]
Repository = "https://github.com/dariussingh/whiletrue"

[project.scripts]
whiletrue = "whiletrue.cli.app:entrypoint"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.8",
  "pyright>=1.1.390",
  "types-PyYAML",
  "poethepoet>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["whiletrue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.coverage.run]
source = ["whiletrue"]
omit = ["*/__main__.py"]
branch = true

[tool.coverage.report]
# Floor: ratchet up, never down.
fail_under = 98
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\.$"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF", "PT", "C4", "PL", "TID"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR", "PLC0415", "B011", "RUF029", "SLF001", "E501", "ASYNC240", "RUF043", "PT022", "UP031", "PT018"]

[tool.pyright]
include = ["whiletrue", "tests"]
exclude = ["tests/fixtures"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = ".devenv/state"
venv = "venv"
executionEnvironments = [
  { root = "tests", extraPaths = ["."], reportPrivateUsage = false, reportUnknownMemberType = false, reportUnknownVariableType = false, reportUnknownArgumentType = false, reportUnknownParameterType = false, reportUnknownLambdaType = false, reportMissingParameterType = false },
  { root = "whiletrue" },
]

[tool.poe.tasks]
format = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check ."
typecheck = "pyright"
test = "pytest"
coverage = "pytest --cov --cov-report=term-missing"
docs-check = "python scripts/docs_check.py"
check = ["format-check", "lint", "typecheck", "coverage", "docs-check"]
