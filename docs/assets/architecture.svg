<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 668" width="960" height="668" role="img" aria-label="whiletrue architecture: CLI and whiletrue.yaml feed the core engine, which uses plugins to drive agent CLIs, git, GitHub and tmux, with state in SQLite">
  <style>
    text{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#d5dbe3}
    .t{font-size:15px;font-weight:700}.d{fill:#7d8896}.b{fill:#151b23;stroke:#2b3440;stroke-width:1.5}
    .g{fill:#12251a;stroke:#3f7a50;stroke-width:1.5}.c{fill:#10222b;stroke:#3a7f96;stroke-width:1.5}.o{fill:#2a1f14;stroke:#a8683a;stroke-width:1.5}
    .l{stroke:#7d8896;stroke-width:1.5;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7d8896"/></marker></defs>
  <rect width="960" height="668" rx="10" fill="#0f1419"/>

  <rect class="b" x="30" y="24" width="900" height="64" rx="6"/>
  <text class="t" x="48" y="50">You</text>
  <text class="d" x="48" y="72">whiletrue.yaml · agents/*.md · whiletrue CLI (run resume approve status panel)</text>

  <path class="l" d="M480 88V112"/>

  <rect class="g" x="30" y="114" width="900" height="206" rx="6"/>
  <text class="t" x="48" y="140">whiletrue.core  (knows no git, GitHub, tmux or agent)</text>
  <rect class="b" x="48" y="156" width="196" height="64" rx="5"/>
  <text x="62" y="182">Loader + validator</text><text class="d" x="62" y="202">config, wiring, limits</text>
  <rect class="b" x="260" y="156" width="196" height="64" rx="5"/>
  <text x="274" y="182">Scheduler</text><text class="d" x="274" y="202">items, parallel, deps</text>
  <rect class="b" x="472" y="156" width="196" height="64" rx="5"/>
  <text x="486" y="182">Pipeline runtime</text><text class="d" x="486" y="202">strategies, journal</text>
  <rect class="b" x="684" y="156" width="228" height="64" rx="5"/>
  <text x="698" y="182">Park / resume / replay</text><text class="d" x="698" y="202">gates, crash recovery</text>
  <rect class="b" x="48" y="236" width="420" height="64" rx="5"/>
  <text x="62" y="262">Plugin API + registry</text><text class="d" x="62" y="282">action modules · strategies · providers · runners</text>
  <rect class="b" x="484" y="236" width="428" height="64" rx="5"/>
  <text x="498" y="262">State store (SQLite, .whiletrue/)</text><text class="d" x="498" y="282">steps · parks · effects · comments · cost</text>

  <path class="l" d="M480 320V346"/>

  <rect class="c" x="30" y="348" width="900" height="190" rx="6"/>
  <text class="t" x="48" y="374">Built-in plugins  (public plugin API only)</text>
  <rect class="b" x="48" y="388" width="140" height="64" rx="5"/><text x="60" y="414">control</text><text class="d" x="60" y="434">loop map switch</text>
  <rect class="b" x="200" y="388" width="140" height="64" rx="5"/><text x="212" y="414">basics</text><text class="d" x="212" y="434">agent shell</text>
  <rect class="b" x="352" y="388" width="140" height="64" rx="5"/><text x="364" y="414">git</text><text class="d" x="364" y="434">worktrees</text>
  <rect class="b" x="504" y="388" width="140" height="64" rx="5"/><text x="516" y="414">github</text><text class="d" x="516" y="434">issues, PRs</text>
  <rect class="b" x="656" y="388" width="130" height="64" rx="5"/><text x="668" y="414">claude_code</text><text class="d" x="668" y="434">headless tmux</text>
  <rect class="b" x="798" y="388" width="114" height="64" rx="5"/><text x="810" y="414">opencode</text><text class="d" x="810" y="434">codex</text>
  <rect x="48" y="462" width="864" height="64" rx="5" fill="#241a2e" stroke="#8b66b0" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="t" x="60" y="486" style="fill:#c9a8e8">rsi (optional, off by default) · Harness²</text>
  <text class="d" x="60" y="508">rsi.harness2: rollouts, improver sessions, blind selection, library, human adoption</text>
  
  <path class="l" d="M480 538V564"/>

  <rect class="o" x="30" y="566" width="900" height="74" rx="6"/>
  <text class="t" x="48" y="592">Outside world</text>
  <text class="d" x="48" y="614">claude · opencode · codex CLIs   |   git   |   gh (GitHub)   |   tmux   |   your tests and scripts</text>
</svg>
