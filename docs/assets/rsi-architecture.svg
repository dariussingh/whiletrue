<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="rsi architecture: for each item, run the steps, propose harness edits, probe them, compose, then select and apply; the result is reflected on, approved by a person and stored in a library that the next item's propose step reads">
<style>
text{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#d5dbe3}
.t{font-weight:700;font-size:15px}.d{fill:#8b96a3}.p{fill:#c9a8e8}.hu{fill:#e8935a}.s{font-size:12px}
.a{fill:#10222b;stroke:#3a7f96;stroke-width:1.5}.h{fill:#2a1f14;stroke:#a8683a;stroke-width:1.5}
.v{fill:#241a2e;stroke:#8b66b0;stroke-width:1.5}.l{stroke:#7d8896;stroke-width:1.5;fill:none;marker-end:url(#m)}
.lp{stroke:#8b66b0;stroke-width:2;fill:none;marker-end:url(#mp)}
</style>
<defs>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7d8896"/></marker>
<marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b66b0"/></marker>
</defs>
<rect width="960" height="420" rx="10" fill="#0f1419"/>

<text class="t" x="30" y="40">For each item</text>
<text class="d s" x="165" y="40">(copies of the workspace, so nothing touches your files until the end)</text>

<rect class="a" x="30" y="60" width="160" height="92" rx="6"/>
<text class="t" x="44" y="88">1 Run</text><text class="d" x="44" y="112">your steps as</text><text class="d" x="44" y="130">they are today</text>
<rect class="a" x="215" y="60" width="160" height="92" rx="6"/>
<text class="t" x="229" y="88">2 Propose</text><text class="d" x="229" y="112">an improver edits</text><text class="d" x="229" y="130">the harness</text>
<rect class="a" x="400" y="60" width="160" height="92" rx="6"/>
<text class="t" x="414" y="88">3 Probe</text><text class="d" x="414" y="112">run each edited</text><text class="d" x="414" y="130">harness</text>
<rect class="a" x="585" y="60" width="160" height="92" rx="6"/>
<text class="t" x="599" y="88">4 Compose</text><text class="d" x="599" y="112">merge the best</text><text class="d" x="599" y="130">edits, run again</text>
<rect class="a" x="770" y="60" width="160" height="92" rx="6"/>
<text class="t" x="784" y="88">5 Select</text><text class="d" x="784" y="112">pick one result,</text><text class="d" x="784" y="130">blind; apply it</text>
<path class="l" d="M190 106H213"/><path class="l" d="M375 106H398"/><path class="l" d="M560 106H583"/><path class="l" d="M745 106H768"/>

<text class="t p" x="30" y="208">Across items</text>
<path class="lp" d="M850 152V240"/>
<rect class="v" x="770" y="242" width="160" height="92" rx="6"/>
<text class="t" x="784" y="270">6 Reflect</text><text class="d" x="784" y="294">what edits did,</text><text class="d" x="784" y="312">one lesson max</text>
<rect class="h" x="585" y="242" width="160" height="92" rx="6"/>
<text class="t hu" x="599" y="270">7 A person</text><text class="d" x="599" y="294">approves what is</text><text class="d" x="599" y="312">adopted</text>
<rect class="v" x="215" y="242" width="160" height="92" rx="6"/>
<text class="t" x="229" y="270">8 Library</text><text class="d" x="229" y="294">lessons per area,</text><text class="d" x="229" y="312">next item reads</text>
<path class="lp" d="M770 288H747"/><path class="lp" d="M585 288H377"/>
<path class="lp" d="M295 242V154"/>
<text class="d s" x="305" y="205" style="fill:#c9a8e8">feeds step 2 of the next item</text>

<text class="d" x="30" y="372">Spend is capped per item (budget_usd): k=1 means 4 runs and 3 improver sessions.</text>
<text class="d" x="30" y="394">Method: Harness² (Xu et al., Google Research, 2026, arXiv:2610.14224), ported into whiletrue.rsi.harness2.</text>
</svg>
