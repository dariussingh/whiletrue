<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" role="img" aria-label="Issue loop flow with human gates: implement with a retrying agent and gate, open a PR, park at a human review gate where comments wake a respond step and rejections go to a fix step, then sync, park at a merge approval and merge">
<style>
text{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#d5dbe3}
.t{font-weight:700;font-size:15px}.d{fill:#7d8896}.ok{fill:#7fd48a}.bad{fill:#ef7a7a}.hu{fill:#e8935a}
.n{fill:#151b23;stroke:#2b3440;stroke-width:1.5}.a{fill:#10222b;stroke:#3a7f96;stroke-width:1.5}
.g{fill:#2a2812;stroke:#a89a3a;stroke-width:1.5}.h{fill:#2a1f14;stroke:#a8683a;stroke-width:1.5}.e{fill:#12251a;stroke:#3f7a50;stroke-width:1.5}
.l{stroke:#7d8896;stroke-width:1.5;fill:none;marker-end:url(#m)}.lg{stroke:#7fd48a;stroke-width:1.5;fill:none;marker-end:url(#mg)}
.lr{stroke:#ef7a7a;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#mr)}.lo{stroke:#e8935a;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#mo)}
</style>
<defs>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7d8896"/></marker>
<marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fd48a"/></marker>
<marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ef7a7a"/></marker>
<marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e8935a"/></marker>
</defs>
<rect width="960" height="590" rx="10" fill="#0f1419"/>
<text class="t" x="30" y="34">Issue loop: one GitHub issue per item, open to merged (recipe:issue-loop)</text><rect class="n" x="30" y="56" width="150" height="64" rx="6"/><text class="t " x="42" y="80">issue</text><text class="d" x="42" y="100">source: github</text><rect class="n" x="215" y="56" width="170" height="64" rx="6"/><text class="t " x="227" y="80">worktree</text><text class="d" x="227" y="100">branch wt/&lt;id&gt;</text><rect class="a" x="420" y="56" width="230" height="64" rx="6"/><text class="t " x="432" y="80">impl: retry max 3</text><text class="d" x="432" y="100">agent, then gate pytest</text><rect class="n" x="685" y="56" width="245" height="64" rx="6"/><text class="t " x="697" y="80">github.open_pr</text><text class="d" x="697" y="100">closes the issue</text><path class="l" d="M180 88H213"/><path class="l" d="M385 88H418"/><path class="l" d="M650 88H683"/><path class="l" d="M807 120V188"/><rect class="h" x="685" y="190" width="245" height="76" rx="6"/><text class="t hu" x="697" y="214">human.approve: review</text><text class="d" x="697" y="234">parks; holds no slot</text><text class="d" x="697" y="252">wake: cli | pr_review</text><rect class="a" x="420" y="190" width="230" height="76" rx="6"/><text class="t " x="432" y="214">on each comment</text><text class="d" x="432" y="234">review-respond: reply</text><text class="d" x="432" y="252">never resolves threads</text><path class="lo" d="M685 214H652"/><path class="lo" d="M652 244H685"/><text class="d" x="668" y="206"></text><rect class="g" x="30" y="190" width="330" height="76" rx="6"/><text class="t " x="42" y="214">fix (rejected)</text><text class="d" x="42" y="234">agent, gate, git push</text><text class="d" x="42" y="252">note arrives as {{input}}</text><path class="lr" d="M720 268V300H195V268"/><text class="bad" x="460" y="292" text-anchor="middle">rejected + note</text><path class="l" d="M195 190V160H720V188"/><text class="d" x="460" y="152" text-anchor="middle">ok: ask for review again</text><path class="lg" d="M870 268V398"/><text class="ok" x="878" y="340">approved</text><rect class="n" x="685" y="400" width="245" height="76" rx="6"/><text class="t " x="697" y="424">github.sync_base</text><text class="d" x="697" y="444">rebase on main</text><rect class="h" x="420" y="400" width="230" height="76" rx="6"/><text class="t hu" x="432" y="424">human.approve: merge</text><text class="d" x="432" y="444">parks until you approve</text><text class="d" x="432" y="462">wake: cli | pr_merged</text><rect class="e" x="30" y="400" width="330" height="76" rx="6"/><text class="t ok" x="42" y="424">github.merge</text><text class="d" x="42" y="444">squash, repo:main lock</text><text class="d" x="42" y="462">issue closed</text><path class="l" d="M685 438H652"/><path class="l" d="M420 438H362"/><rect class="a" x="30" y="510" width="16" height="16" rx="3"/><text class="d" x="54" y="523">agent</text><rect class="g" x="120" y="510" width="16" height="16" rx="3"/><text class="d" x="144" y="523">agent or gate fix</text><rect class="h" x="290" y="510" width="16" height="16" rx="3"/><text class="d" x="314" y="523">human gate</text><rect class="e" x="410" y="510" width="16" height="16" rx="3"/><text class="d" x="434" y="523">side effect</text><text class="d" x="30" y="552">Each human gate parks only its own issue. Decide with whiletrue approve, reject --note or comment.</text><text class="d" x="30" y="570">Then whiletrue resume: finished steps replay and nothing runs twice.</text></svg>