[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whiletrue"
version = "0.2.0"
description = "Local orchestrator that runs pipelines of agent and deterministic steps around Claude Code, opencode and Codex, with gates, human approval, parallel git worktrees and crash-safe resume."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "third_party/harness2/LICENSE"]
authors = [{ name = "Darius Singh" }]
keywords = ["recursive-self-improvement", "agents", "ai-agents", "claude-code", "codex", "coding-agents", "human-in-the-loop", "opencode", "orchestration", "pipelines", "ralph", "tmux", "git-worktree"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "pyyaml>=6,<7",
  "common-expression-language>=0.10,<1",
]

[project.urls]
Repository = "https://github.com/dariussingh/whiletrue"
Changelog = "https://github.com/dariussingh/whiletrue/blob/main/CHANGELOG.md"
Documentation = "https://github.com/dariussingh/whiletrue/tree/main/docs"

[project.scripts]
whiletrue = "whiletrue.cli.app:entrypoint"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.8",
  "pyright>=1.1.390",
  "types-PyYAML",
  "poethepoet>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["whiletrue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.coverage.run]
source = ["whiletrue"]
omit = ["*/__main__.py"]
branch = true

[tool.coverage.report]
# Floor: ratchet up, never down.
fail_under = 98
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\.$"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF", "PT", "C4", "C90", "PL", "TID"]
# Not enforced: argument counts (keyword-only store and config APIs), return counts and magic
# numbers read better as written. Complexity, branches and statements are enforced.
ignore = ["PLR0913", "PLR2004", "PLR0911", "RUF012"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# Prompt text carries markdown tables that are clearer unwrapped.
"whiletrue/rsi/harness2/prompts.py" = ["E501"]
"tests/**" = ["PLR", "PLC0415", "B011", "RUF029", "SLF001", "E501", "ASYNC240", "RUF043", "PT022", "UP031", "PT018"]

[tool.pyright]
include = ["whiletrue", "tests"]
exclude = ["tests/fixtures"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = ".devenv/state"
venv = "venv"
executionEnvironments = [
  { root = "tests", extraPaths = ["."], reportPrivateUsage = false, reportUnknownMemberType = false, reportUnknownVariableType = false, reportUnknownArgumentType = false, reportUnknownParameterType = false, reportUnknownLambdaType = false, reportMissingParameterType = false },
  { root = "whiletrue" },
]

[tool.poe.tasks]
format = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check ."
typecheck = "pyright"
test = "pytest"
coverage = "pytest --cov --cov-report=term-missing"
docs-check = "python scripts/docs_check.py"
check = ["format-check", "lint", "typecheck", "coverage", "docs-check"]
