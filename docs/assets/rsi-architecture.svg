<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="rsi architecture: task-level recursion per item runs reference rollouts, proposes general and domain harness edits, probes them, composes final harnesses and selects one blind; harnessing-level recursion across items reflects, asks a person to approve adoption, and stores lessons in a per-domain library that feeds the next item">
<style>
text{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#c9d1d9}
.t{font-weight:700;font-size:15px}.d{fill:#8b949e}.p{fill:#d2a8ff}.hu{fill:#ffa657}.s{font-size:12px}
.a{fill:#0c2a4d;stroke:#388bfd;stroke-width:1.5}.h{fill:#2d1b0e;stroke:#db6d28;stroke-width:1.5}
.v{fill:#271a3d;stroke:#8957e5;stroke-width:1.5}.g{fill:#0f2d1a;stroke:#2ea043;stroke-width:1.5}
.y{fill:#2d2305;stroke:#d29922;stroke-width:1.5}.n{fill:#161b22;stroke:#30363d;stroke-width:1.5}
.l{stroke:#8b949e;stroke-width:1.5;fill:none;marker-end:url(#m)}
.lp{stroke:#8957e5;stroke-width:2;fill:none;marker-end:url(#mp)}
</style>
<defs>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker>
<marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8957e5"/></marker>
</defs>
<rect width="960" height="600" rx="10" fill="#0d1117"/>

<rect x="16" y="14" width="928" height="296" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
<text class="t" x="32" y="40">Task-level recursion</text>
<text class="d s" x="236" y="40">one item at a time, every run in its own copy of the workspace</text>

<rect class="a" x="30" y="60" width="160" height="136" rx="6"/>
<text class="t" x="44" y="86">1 Reference</text><text class="t" x="44" y="104">rollouts</text>
<text class="d" x="44" y="130">k runs of your</text><text class="d" x="44" y="148">steps on the</text><text class="d" x="44" y="166">current harness;</text><text class="d" x="44" y="184">full trajectories</text>

<rect class="a" x="215" y="60" width="160" height="136" rx="6"/>
<text class="t" x="229" y="86">2 Propose</text>
<text class="d" x="229" y="112">improver sessions</text><text class="d" x="229" y="130">read the task,</text><text class="d" x="229" y="148">trajectories,</text><text class="d" x="229" y="166">harness, library</text><text class="d" x="229" y="184">(no scores)</text>

<rect class="a" x="400" y="60" width="160" height="136" rx="6"/>
<text class="t" x="414" y="86">3 Probe</text>
<rect class="g" x="412" y="96" width="136" height="42" rx="5"/>
<text class="t s" x="422" y="114" style="font-size:13px">INV candidate</text><text class="d s" x="422" y="130">how it works</text>
<rect class="y" x="412" y="146" width="136" height="42" rx="5"/>
<text class="t s" x="422" y="164" style="font-size:13px">DOM candidate</text><text class="d s" x="422" y="180">expert knowledge</text>

<rect class="a" x="585" y="60" width="160" height="136" rx="6"/>
<text class="t" x="599" y="86">4 Compose</text>
<text class="d" x="599" y="112">merge the edits</text><text class="d" x="599" y="130">the rollouts back</text><text class="d" x="599" y="148">up; k final</text><text class="d" x="599" y="166">harnesses, each</text><text class="d" x="599" y="184">run again</text>

<rect class="a" x="770" y="60" width="160" height="136" rx="6"/>
<text class="t" x="784" y="86">5 Select</text>
<text class="d" x="784" y="112">blind pick of one</text><text class="d" x="784" y="130">result among</text><text class="d" x="784" y="148">anonymous ones;</text><text class="d" x="784" y="166">fallback: base run</text>
<path class="l" d="M190 128H213"/><path class="l" d="M375 128H398"/><path class="l" d="M560 128H583"/><path class="l" d="M745 128H768"/>

<rect class="v" x="400" y="222" width="345" height="72" rx="6"/>
<text class="t p" x="414" y="246" style="font-size:14px">Budget</text>
<text class="d s" x="414" y="268">R = 4k runs, P = 3k sessions per item</text>
<text class="d s" x="414" y="284">hard cap budget_usd; stages reused on resume</text>
<rect class="h" x="770" y="222" width="160" height="72" rx="6"/>
<text class="t hu" x="784" y="246" style="font-size:14px">Applied</text>
<text class="d s" x="784" y="268">file changes go to</text><text class="d s" x="784" y="284">your workspace</text>
<path class="l" d="M850 196V220"/>

<rect x="16" y="330" width="928" height="228" rx="12" fill="#1c1230" stroke="#8957e5" stroke-width="1.5"/>
<text class="t p" x="32" y="356">Harnessing-level recursion</text>
<text class="d s" x="292" y="356">what one item learns is kept for the next</text>

<path class="lp" d="M850 294V374"/>
<rect class="v" x="770" y="376" width="160" height="104" rx="6"/>
<text class="t" x="784" y="402">6 Reflect</text>
<text class="d" x="784" y="428">what edits did;</text><text class="d" x="784" y="446">at most one</text><text class="d" x="784" y="464">lesson to keep</text>
<rect class="h" x="540" y="376" width="205" height="104" rx="6"/>
<text class="t hu" x="554" y="402">7 A person adopts</text>
<text class="d" x="554" y="428">approve | auto | never</text><text class="d" x="554" y="446">scripts and hooks</text><text class="d" x="554" y="464">always need approval</text>
<rect class="v" x="215" y="376" width="285" height="104" rx="6"/>
<text class="t" x="229" y="402">8 Experience library</text>
<text class="d" x="229" y="428">per domain: adopted harnesses</text><text class="d" x="229" y="446">and their lessons, read by the</text><text class="d" x="229" y="464">next item's improver sessions</text>
<path class="lp" d="M770 428H747"/><path class="lp" d="M540 428H502"/>
<path class="lp" d="M295 376V198"/>
<text class="d s" x="305" y="322" style="fill:#d2a8ff">feeds step 2 of the next item</text>

<text class="d s" x="30" y="578">Method: Harness² (Xu et al., Google Research, 2026, arXiv:2610.14224), ported into whiletrue.rsi.harness2.</text>
</svg>
